name: Daily Report (manual only)

on:
  # 仅手动触发：检索+推送已合并进 search.yml（检索完立即推送，避免 sleep 撑时烧计费分钟）。
  # 保留本文件供需要时手动重生成报告。
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # ⚠️ 使用 GH_PAT 而非默认 GITHUB_TOKEN，因此 [skip ci] 标签是防止 CI 无限循环的关键防线
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Generate report & push
        run: python scripts/report.py
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SERVER_CHAN_SENDKEY: ${{ secrets.SERVER_CHAN_SENDKEY }}
          GAODE_API_KEY: ${{ secrets.GAODE_API_KEY }}

      # [skip ci] 防止 GH_PAT commit 触发新的 workflow，形成无限循环
      - name: Commit report
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "report: daily HTML report [skip ci]"
          file_pattern: 'output/'
          commit_user_name: 'github-actions[bot]'
          commit_user_email: 'github-actions[bot]@users.noreply.github.com'
