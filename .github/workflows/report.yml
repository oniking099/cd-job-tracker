# ⚠️⚠️ [已废弃 DEPRECATED — 2026-08-09] ⚠️⚠️
# 本 workflow 已废弃，保留文件仅为存档，请勿手动运行。
# 废弃原因：报告生成已并入 search.yml（检索完立即生成双 HTML，--no-push），
# 微信推送已拆到 push.yml（每日 11:00 BJT 推送前一日结果 + BOSS 登录提醒）。
# 本文件里的 report.py 默认带推送，手动跑会重复推送 → 已整条 job 禁用。
# 如需重生成报告：本地跑 `python scripts/report.py` 即可。
name: Daily Report (已废弃，勿运行)

on:
  # 仅手动触发：报告生成+推送已合并进 search.yml / push.yml，本文件不再需要。
  workflow_dispatch:

jobs:
  report:
    # 已废弃：整条 job 恒跳过，即使误点也不会产生任何计算分钟/重复推送
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # ⚠️ 使用 GH_PAT 而非默认 GITHUB_TOKEN，因此 [skip ci] 标签是防止 CI 无限循环的关键防线
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Generate report & push
        run: python scripts/report.py
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SERVER_CHAN_SENDKEY: ${{ secrets.SERVER_CHAN_SENDKEY }}
          GAODE_API_KEY: ${{ secrets.GAODE_API_KEY }}

      # [skip ci] 防止 GH_PAT commit 触发新的 workflow，形成无限循环
      - name: Commit report
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "report: daily HTML report [skip ci]"
          file_pattern: 'output/'
          commit_user_name: 'github-actions[bot]'
          commit_user_email: 'github-actions[bot]@users.noreply.github.com'
