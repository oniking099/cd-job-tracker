name: Daily Report

on:
  schedule:
    - cron: '30 13 * * *'   # 21:30 北京时间

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate report & push
        run: python scripts/report.py
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SERVER_CHAN_SENDKEY: ${{ secrets.SERVER_CHAN_SENDKEY }}
          GAODE_API_KEY: ${{ secrets.GAODE_API_KEY }}

      - name: Commit report
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "report: daily HTML report [skip ci]"
          file_pattern: 'output/'
          commit_user_name: 'github-actions[bot]'
          commit_user_email: 'github-actions[bot]@users.noreply.github.com'
