name: Job Search

on:
  workflow_dispatch:
  schedule:
    # 北京时间 12:00~17:00，每小时一轮
    # UTC = BJT - 8h
    - cron: '0 4 * * *'    # 12:00 BJT → round 12
    - cron: '0 5 * * *'    # 13:00 BJT → round 13
    - cron: '0 6 * * *'    # 14:00 BJT → round 14
    - cron: '0 7 * * *'    # 15:00 BJT → round 15
    - cron: '0 8 * * *'    # 16:00 BJT → round 16
    - cron: '0 9 * * *'    # 17:00 BJT → round 17

# 注意：使用 concurrency group 防止同一轮次重复执行
# cancel-in-progress: false 确保即使前一轮延迟也排队执行
concurrency:
  group: chengdu-job-search
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    # agent 平台每轮多关键词 × 受限并发(3)，实际耗时可能 1h+；30min 装完依赖就不剩多少
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # ⚠️ 使用 GH_PAT 而非默认 GITHUB_TOKEN，因此 [skip ci] 标签是防止 CI 无限循环的关键防线
          # 若误删 commit message 中的 [skip ci]，每次搜索提交将触发新的 workflow 运行
          token: ${{ secrets.GH_PAT }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      # Camoufox 二进制按平台缓存（Firefox fork ~100MB，避免每轮重新下载）
      - name: Cache Camoufox binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/camoufox
          key: camoufox-${{ runner.os }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          # 11 个普通平台走 Chromium（含系统依赖）
          python -m playwright install chromium --with-deps
          # Camoufox 是 Firefox 源码级 fork：需要 Firefox 系统库（libgtk 等）
          python -m playwright install-deps firefox
          # 下载 Camoufox Linux 二进制（CI 在 GitHub 网络，无本地 GFW 下载问题）
          python -m camoufox fetch

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Run search round
        run: python scripts/search.py
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          QWENVL_API_KEY: ${{ secrets.QWENVL_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GAODE_API_KEY: ${{ secrets.GAODE_API_KEY }}

      # [skip ci] 防止 GH_PAT commit 触发新的 workflow，形成无限循环
      - name: Commit search data
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "data: search results [skip ci]"
          file_pattern: 'data/'
          commit_user_name: 'github-actions[bot]'
          commit_user_email: 'github-actions[bot]@users.noreply.github.com'
