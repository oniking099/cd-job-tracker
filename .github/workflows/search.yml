name: Job Search

on:
  workflow_dispatch:
  schedule:
    # 北京时间 01:00 开始顺序跑 5 轮（UTC = BJT - 8h）
    # GitHub 调度有 ~2.5h 延迟风险：即使 01:00 被延迟到 04:00 才触发，
    # 仍是第一轮先跑、确认后立即下一轮；真正的停止在脚本内 21:00 BJT 截止兜底。
    - cron: '0 17 * * *'

# 防止同一工作流重叠执行；cancel-in-progress: false 确保排队执行而非中断
concurrency:
  group: chengdu-job-search
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    # 5 轮 × 每轮 ~2h 上界 + 依赖安装；脚本内 21:00 BJT 截止会提前退出，这里是最后一层保险
    timeout-minutes: 1200

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # ⚠️ 使用 GH_PAT 而非默认 GITHUB_TOKEN，因此 [skip ci] 标签是防止 CI 无限循环的关键防线
          # 若误删 commit message 中的 [skip ci]，每次搜索提交将触发新的 workflow 运行
          token: ${{ secrets.GH_PAT }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      # Camoufox 二进制按平台缓存（Firefox fork ~100MB，避免每轮重新下载）
      - name: Cache Camoufox binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/camoufox
          key: camoufox-${{ runner.os }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          # 普通平台走 Chromium（含系统依赖）
          python -m playwright install chromium --with-deps
          # Camoufox 是 Firefox 源码级 fork：需要 Firefox 系统库（libgtk 等）
          python -m playwright install-deps firefox
          # 下载 Camoufox Linux 二进制（CI 在 GitHub 网络，无本地 GFW 下载问题）
          python -m camoufox fetch

      - name: Run tests
        run: python -m pytest tests/ -v

      # ---- 顺序制 5 轮：一轮跑完→确认→提交→下一轮 ----
      # continue-on-error: true —— 单轮失败/超时（21:00 BJT 截止）不阻断后续轮次
      # 逐轮 git-auto-commit 保证 21:30 报告能融合到已完成轮次（用户要的"中断后融合"）
      # 登录 Cookie 注入：BOSS_COOKIE / YUPAO_COOKIE 为可选 GitHub Secret，
      # 未配置时平台自动降级（免登录链路），不失败。
      - name: Round 1 (气象/大气科学)
        continue-on-error: true
        run: python scripts/search.py --round 1
        env: &job_env
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          QWENVL_API_KEY: ${{ secrets.QWENVL_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # 视觉降级链：ModelScope(免费2000/天) → SiliconFlow → Gemini → Qwen-VL
          MODELSCOPE_API_KEY: ${{ secrets.MODELSCOPE_API_KEY }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          GAODE_API_KEY: ${{ secrets.GAODE_API_KEY }}
          BOSS_COOKIE: ${{ secrets.BOSS_COOKIE }}
          YUPAO_COOKIE: ${{ secrets.YUPAO_COOKIE }}
          SERVER_CHAN_SENDKEY: ${{ secrets.SERVER_CHAN_SENDKEY }}

      - name: Commit round 1 data
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "data: round-1 search results [skip ci]"
          file_pattern: 'data/'
          commit_user_name: 'github-actions[bot]'
          commit_user_email: 'github-actions[bot]@users.noreply.github.com'

      - name: Round 2 (环境/生态)
        continue-on-error: true
        run: python scripts/search.py --round 2
        env:
          <<: *job_env

      - name: Commit round 2 data
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "data: round-2 search results [skip ci]"
          file_pattern: 'data/'
          commit_user_name: 'github-actions[bot]'
          commit_user_email: 'github-actions[bot]@users.noreply.github.com'

      - name: Round 3 (AI/大模型 + 补充长尾)
        continue-on-error: true
        run: python scripts/search.py --round 3
        env:
          <<: *job_env

      - name: Commit round 3 data
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "data: round-3 search results [skip ci]"
          file_pattern: 'data/'
          commit_user_name: 'github-actions[bot]'
          commit_user_email: 'github-actions[bot]@users.noreply.github.com'

      - name: Round 4 (AI Agent/应用)
        continue-on-error: true
        run: python scripts/search.py --round 4
        env:
          <<: *job_env

      - name: Commit round 4 data
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "data: round-4 search results [skip ci]"
          file_pattern: 'data/'
          commit_user_name: 'github-actions[bot]'
          commit_user_email: 'github-actions[bot]@users.noreply.github.com'

      - name: Round 5 (交叉学科)
        continue-on-error: true
        run: python scripts/search.py --round 5
        env:
          <<: *job_env

      - name: Commit round 5 data
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "data: round-5 search results [skip ci]"
          file_pattern: 'data/'
          commit_user_name: 'github-actions[bot]'
          commit_user_email: 'github-actions[bot]@users.noreply.github.com'

      # ---- 检索完成后立即生成报告并推送（不固定 21:30）----
      # 5 轮跑完（或 21:00 BJT 截止提前结束）即融合已完成轮次 → HTML + ServerChan 推送。
      # 若用 sleep 撑到 21:30 会持续占用 runner → 每天约 20h 计费分钟（免费额度 2000/月），
      # 故改为"检索完直接推送"（用户 2026-08-05 拍板；检索自然跑满则在 ~21:00 推送）。
      - name: Generate report & push
        if: always()
        run: python scripts/report.py
        env:
          <<: *job_env
